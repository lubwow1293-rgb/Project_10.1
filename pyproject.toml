[tool.poetry]
name = "project-10-1"
version = "0.1.0"
description = ""
authors = ["Vladimir Lubyagin <loobyagin@yandex.ru>"]
readme = "README.md"
packages = [{include = "project_10"}]

[tool.poetry.dependencies]
python = "^3.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.5.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.black]
# Максимальная длина строки
line-length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'